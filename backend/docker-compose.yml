

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8005:8000"
    volumes:
      - ./:/app
    environment:
      - DATABASE_URL=postgresql://allbounds:allbounds@db:5432/allbounds
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=masterKey
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_TTL=300
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - R2_ENDPOINT=
      - R2_ACCESS_KEY=
      - R2_SECRET_KEY=
      - R2_BUCKET_NAME=allbounds
      - JWT_SECRET_KEY=dev_secret_key_change_in_production
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=43200
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=30
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=10
      - DB_POOL_RECYCLE=3600
      - DB_POOL_TIMEOUT=30
      - DB_CONNECT_TIMEOUT=10
      - DB_POOL_PRE_PING=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      search_indexer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 2
      start_period: 40s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --log-level warning --limit-max-requests 100 --timeout-keep-alive 5

  search_indexer:
    build: .
    restart: "no"
    volumes:
      - ./:/app
    environment:
      - DATABASE_URL=postgresql://allbounds:allbounds@db:5432/allbounds
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=masterKey
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_TTL=300
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - R2_ENDPOINT=
      - R2_ACCESS_KEY=
      - R2_SECRET_KEY=
      - R2_BUCKET_NAME=allbounds
      - JWT_SECRET_KEY=dev_secret_key_change_in_production
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=43200
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=30
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=10
      - DB_POOL_RECYCLE=3600
      - DB_POOL_TIMEOUT=30
      - DB_CONNECT_TIMEOUT=10
      - DB_POOL_PRE_PING=true
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    command: python index_all_data.py

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=allbounds
      - POSTGRES_PASSWORD=allbounds
      - POSTGRES_DB=allbounds
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allbounds"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.3
    restart: unless-stopped
    ports:
      - "7705:7700"
    environment:
      - MEILI_MASTER_KEY=masterKey
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  celery_worker:
    build: .
    restart: unless-stopped
    volumes:
      - ./:/app
    environment:
      - DATABASE_URL=postgresql://allbounds:allbounds@db:5432/allbounds
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=masterKey
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      search_indexer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: celery -A app.celery_app worker --loglevel=info

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  meilisearch_data:
  redis_data:
